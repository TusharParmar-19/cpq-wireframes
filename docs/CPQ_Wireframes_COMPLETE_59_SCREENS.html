</script><script>/* CPQ self-contained browser wireframes. No network, no backend, no real transactions. */

function handleAction(a){if(a==='explorer')return explorer();if(a==='journey-picker')return journeyPicker();if(a==='close-modal')return closeModal();if(a==='clear-journey'){activeFlow='';render();return}if(a==='save'){saveDemo();return}if(a==='confirm-order')return previewConfirm();if(a==='simulate-confirm'){memory.demoConfirm=true;memory.events.unshift('Order registration simulated in browser — not real');persist();closeModal();navigate('PG-032');toast('Registration preview complete. No real order was registered.');return}if(a==='mobile'){const b=document.body.classList.toggle('mobile-preview');if(b)document.body.classList.add('mobile-preview');render();window.scrollTo(0,0);return}if(a==='reset-state'){demoState='normal';render();return}if(a==='reset-demo'){openModal('Reset local demonstration data',`<p>Clear locally saved sample form entries, demonstration BOQ lines, uploaded filenames and simulated events? No actual business information is affected.</p>`,`<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="confirm-reset">Reset demo</button>`);return}if(a==='confirm-reset'){memory={forms:{},addedLines:[],events:[],uploadedNames:[],demoConfirm:false};persist();closeModal();render();toast('Local browser demo data cleared.');return}if(a==='add-line'){const val=x=>$(`[data-form-key="PG-101::${x}"]`)?.value||'';const desc=val('Product / service / custom description').trim();const qty=Number(val('Quantity'));const rate=Number(val('Selling / agreed rate (₹)'));if(!desc||!Number.isFinite(qty)||qty<=0||!Number.isFinite(rate)||rate<0){toast('Enter a description and valid quantity and rate for this demo line.');return}memory.addedLines.push({type:val('Line type')||'Custom',description:desc,unit:val('Unit')||'Each',quantity:qty,rate});persist();navigate('PG-100');toast('Sample BOQ line added locally (not saved to a backend).');return}if(a==='switch-finance'){role='Accounts / Finance';render();toast('Preview role changed locally. This is not real authorization.');return}if(a==='review-quote'){openModal('Quotation review checklist',`<div class="step"><span class="step-number">1</span><div class="step-main"><b>BOQ & commercial totals</b><small>Finance-approved calculations required</small></div>${badge('Review')}</div><div class="step"><span class="step-number">2</span><div class="step-main"><b>Approval decisions</b><small>Revision-specific approvals required where applicable</small></div>${badge('Review')}</div><div class="step"><span class="step-number">3</span><div class="step-main"><b>Scope, terms and template</b><small>Correct legal entity and customer-facing content</small></div>${badge('Review')}</div>`,`<button class="btn" data-act="close-modal">Close</button><button class="btn primary" data-go="PG-080">View approvals</button>`);return}if(a==='context'){toast('Context selection is a visual demo; no access permissions changed.');return}if(a==='mock-pdf'){openModal('PDF generation preview',`<p>This is a low-fidelity document layout. No PDF has been generated or issued, and no customer communication has occurred.</p><div class="help">Final templates, approval checks, source revision and attachment rules must be implemented in the real application.</div>`,`<button class="btn" data-act="close-modal">Close</button><button class="btn primary" data-go="PG-111">View sample archive</button>`);return}if(a==='upload-name'){const inp=$('#proto-file');if(!inp?.files?.length){toast('Choose a sample file first. The file is not uploaded.');return}memory.uploadedNames.unshift(inp.files[0].name);memory.uploadedNames=memory.uploadedNames.slice(0,5);persist();render();toast('Filename recorded locally. File bytes were not uploaded or stored.');return}if(a==='note'){const key=`${screen}::Note or reason`;const value=$(`[data-form-key="${key}"]`)?.value||'';if(!value.trim()){toast('Enter a sample note before adding.');return}memory.events.unshift(value.trim());persist();render();toast('Note added to browser demo history.');return}if(a==='clear-filters'){const f=$('#table-search');if(f)f.value='';const st=$('#table-status');if(st)st.value='';filterRows();return}if(a==='no-download'){toast('This is a placeholder: no original file is bundled or downloaded.');return}if(a==='reorder'){toast('Attachment order controls are represented here; no final PDF was changed.');return}if(a==='export-csv'){const d=REPORTS[screen];if(!d){toast('Open a report first.');return}const csv=[d.columns,...d.rows].map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='CPQ_'+screen+'_SAMPLE_ONLY.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Fictional sample CSV exported locally. No live report data.');return}}
function filterRows(){const q=($('#table-search')?.value||'').toLowerCase().trim(),st=($('#table-status')?.value||'').toLowerCase();let visible=0;$$('#table-body tr').forEach(row=>{const value=row.textContent.toLowerCase();const match=(!q||value.includes(q))&&(!st||value.includes(st));row.hidden=!match;if(match)visible++});const cnt=$('#row-count');if(cnt)cnt.textContent=visible+' sample record(s)';const e=$('#table-empty');if(e)e.classList.toggle('hide',visible!==0)}
function updateLinePreview(){if(screen!=='PG-101')return;const q=Number($('[data-form-key="PG-101::Quantity"]')?.value||0),r=Number($('[data-form-key="PG-101::Selling / agreed rate (₹)"]')?.value||0);const target=$('#line-preview');if(target)target.textContent=(Number.isFinite(q*r)?'₹ '+(q*r).toLocaleString('en-IN',{maximumFractionDigits:2}):'—')}
function closeSidebar(){const el=$('#sidebar');if(el)el.classList.remove('open');const shade=$('#mobile-shade');if(shade)shade.classList.remove('show')}
function openSidebar(){const el=$('#sidebar');if(el)el.classList.add('open');const shade=$('#mobile-shade');if(shade)shade.classList.add('show')}
document.addEventListener('click',e=>{const flow=e.target.closest('[data-flow]');if(flow){activeFlow=flow.dataset.flow;const f=FLOWS.find(x=>x.id===activeFlow);closeModal();navigate(f.steps[0]);return}const go=e.target.closest('[data-go]');if(go){closeModal();closeSidebar();navigate(go.dataset.go);return}const act=e.target.closest('[data-act]');if(act){handleAction(act.dataset.act);return}const tab=e.target.closest('[data-detail-tab]');if(tab){const d=DETAIL[screen];const index=Number(tab.dataset.detailTab);if(d&&d.tabs[index]){$$('#detail-tabbar button').forEach(x=>x.classList.remove('active'));tab.classList.add('active');$('#detail-body').textContent=d.tabs[index][1]}return}if(e.target.matches('#menu-button')){openSidebar();return}if(e.target.matches('#close-sidebar')||e.target.matches('#mobile-shade')){closeSidebar();return}if(e.target.matches('#overlay')){closeModal();return}});
document.addEventListener('input',e=>{if(e.target.id==='explorer-search'){explorerFilter=e.target.value;const list=$('#explorer-list');if(list)list.innerHTML=explorerItems(explorerFilter)}if(e.target.id==='table-search'||e.target.id==='table-status')filterRows();if(e.target.matches('[data-form-key]'))updateLinePreview()});
document.addEventListener('change',e=>{if(e.target.id==='table-status')filterRows();if(e.target.id==='role-selector'){role=e.target.value;render();toast('Demo role preview: '+role+'. No actual permissions changed.')}if(e.target.id==='demo-state'){demoState=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();explorer()}if(e.key==='Enter'&&e.target.closest('tr[data-nav]'))navigate(e.target.closest('tr[data-nav]').dataset.nav)});
if(batch==='5')document.body.classList.add('mobile-preview');
// Ensure all local option lists used by specific views exist.
OPTIONS.lineTypes=['Product','Service','Custom'];OPTIONS.verification=['Values match original evidence','Discrepancy found / correction required','Exception under approved policy'];OPTIONS.documentCategory=['Customer Enquiry','Customer PO / WO / LOI','Customer BOQ','Vendor Quotation','Technical Datasheet','Drawing','Approval Evidence'];OPTIONS.documentSource=['Customer','Supplier','Employee / Internal','System-generated'];OPTIONS.visibility=['Assigned Record Team','Authorized Management','Restricted / Confidential'];OPTIONS.packageType=['Commercial Quotation PDF','Technical PDF Package','Combined Package'];OPTIONS.activityType=['Call','Email','WhatsApp','Meeting','Record Correction','Internal Note'];
let dashboardDrilldown=null;
const previousDashboard=dashboard;
const previousRegisterPage=registerPage;
const previousFilterRows=filterRows;
const previousNavigate=navigate;

function salespersonDashboard(){
  const num=n=>String(n).padStart(2,'0');
  const quotes=REGISTER['PG-020'].rows.filter(r=>r[4]==='Salesperson A');
  const opportunities=REGISTER['PG-010'].rows.filter(r=>r[3]==='Salesperson A'&&!['Won','Lost','Closed'].includes(r[4]));
  const approvals=REGISTER['PG-080'].rows.filter(r=>r[3]==='Salesperson A'&&r[5]==='Pending');
  const vendorPending=REGISTER['PG-070'].rows.filter(r=>r[2]==='QT-2026-014'&&r[4]==='Unverified');
  const draftOrders=REGISTER['PG-030'].rows.filter(r=>r[5]==='Draft');
  const registeredOrders=REGISTER['PG-030'].rows.filter(r=>r[5]==='Registered');
  const entity=memory.forms['PG-003::Entity']||COMPANY[0];
  const branch=memory.forms['PG-003::Branch']||'Main Branch';
  const metrics=[
    ['My Open Opportunities',num(opportunities.length),'Open / in preparation','PG-010','my-opportunities'],
    ['My Draft Quotations',num(quotes.filter(r=>r[5]==='Draft').length),'Finish and review drafts','PG-020','my-drafts'],
    ['Awaiting Approval',num(approvals.length),'My requests, not decisions','PG-080','awaiting-approval'],
    ['My Sent Quotations',num(quotes.filter(r=>r[5]==='Sent').length),'Actually dispatched offers','PG-020','my-sent'],
    ['My Won / Lost',`${quotes.filter(r=>r[5]==='Won').length} / ${quotes.filter(r=>r[5]==='Lost').length}`,'Won / Lost outcomes','PG-020','my-won-lost'],
    ['Draft Direct Orders',num(draftOrders.length),'Not yet registered','PG-030','draft-orders'],
    ['Registered Orders',num(registeredOrders.length),'Registered is not revenue','PG-030','registered-orders'],
    ['Vendor Evidence Follow-up',num(vendorPending.length),'Status only; source rates restricted','PG-070','vendor-followup']
  ];
  const cards=metrics.map(([label,value,detail,to,filter])=>`<button class="metric sales-metric" type="button" data-go="${to}" data-dash-filter="${filter}" data-dash-label="${esc(label)}"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-foot">${esc(detail)} ↗</div></button>`).join('');
  const myWork=[
    ['Q','Continue quotation BOQ','QT-2026-014 · ABC Industries · Draft R1','03 Nov 2026 · Draft','PG-021'],
    ['O','Review open enquiry','OP-2026-008 · ABC Industries · In Discussion','03 Nov 2026 · Assigned','PG-012'],
    ['D','Complete Direct Order draft','DO-DRAFT-008 · Sunrise Manufacturing · Customer WO','03 Nov 2026 · Evidence required','PG-031'],
    ['A','Track requested approval','APR-TEST-021 · QT-2026-014 · Manager review','02 Nov 2026 · Pending approval','PG-082']
  ].map(([tag,title,ref,detail,to])=>`<div class="step"><span class="step-number">${tag}</span><div class="step-main"><b>${esc(title)}</b><small>${esc(ref)}</small><small>${esc(detail)}</small></div>${button('Open',to)}</div>`).join('');
  const activity=[
    ['03 Nov 2026 · 11:20 AM','Quotation R1 draft updated','QT-2026-014 · Salesperson A','PG-022'],
    ['03 Nov 2026 · 10:40 AM','Direct Order draft saved','DO-DRAFT-008 · Salesperson A','PG-032'],
    ['02 Nov 2026 · 04:30 PM','Approval request recorded','APR-TEST-021 · Salesperson A','PG-082'],
    ['02 Nov 2026 · 02:15 PM','Quotation dispatch recorded','QT-2026-011 · R0 · Salesperson A','PG-024']
  ].map(([date,title,record,to])=>`<div class="sales-event"><div><div class="sales-event-date">${esc(date)}</div><b>${esc(title)}</b><small>${esc(record)}</small></div>${button('Open',to)}</div>`).join('');
  const orderSummary=`<div class="help">Draft is not Registered. Customer-agreed order values do not automatically mean recognized accounting revenue.</div>
    <div class="sales-order-row"><div><b>DO-DRAFT-008</b><small>Sunrise Manufacturing · Direct Order · 03 Nov 2026</small></div><span class="status warn">Draft</span>${button('Continue','PG-031')}</div>
    <div class="sales-order-row"><div><b>ORD-2026-021</b><small>ABC Industries · Accepted Quotation · 02 Nov 2026</small></div><span class="status">Registered</span>${button('Open','PG-032')}</div>
    <div class="sales-order-row"><div><b>ORD-2026-019</b><small>Greenfield Facility · Direct Order · 01 Nov 2026</small></div><span class="status">Registered</span>${button('Open','PG-032')}</div>
    <div class="actionbar">${button('Open order register','PG-030')}</div>`;
  return `<section class="sales-context" aria-label="Working company and branch"><div class="sales-context-heading"><strong>Salesperson dashboard</strong><small>Salesperson A · My assigned records only (demo)</small></div>
    <div class="sales-context-control"><label for="sales-entity">Working company</label><select id="sales-entity">${COMPANY.map(x=>`<option value="${esc(x)}" ${x===entity?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
    <div class="sales-context-control"><label for="sales-branch">Current branch</label><select id="sales-branch">${['Main Branch','Secondary Branch'].map(x=>`<option ${x===branch?'selected':''}>${x}</option>`).join('')}</select></div></section>
    <p class="sales-context-note">Fictional authorized examples. Company/branch selection is UI preview only; it does not change permissions or sample totals.</p>
    <div class="four-col sales-cards">${cards}</div>
    <div class="split section sales-columns">${panel('My Work · Priority Actions',myWork+`<div class="actionbar">${button('See My Work','PG-004')}</div>`)}
    ${panel('Recent Activity',activity+`<div class="actionbar">${button('View Activity Timeline','PG-120')}</div>`)}</div>
    <div class="section">${panel('My Direct Orders · Draft vs Registered',orderSummary)}</div>
    <div class="section">${panel('Quick Actions',`<div class="flex-actions">${primary('New Opportunity','PG-011')}${button('New Quotation','PG-021')}${button('New Direct Order','PG-031')}${button('My Work','PG-004')}</div>`)}</div>
    <div class="footnote">Real dashboard totals and links must follow tenant, entity, branch, role and individual record-assignment rules. This wireframe uses sample data and does not perform real authorization.</div>`;
}

dashboard=function(){
  if(role!=='Salesperson')return `<div class="warning">This review updates only the Salesperson dashboard. Manager / Owner and other role layouts will be reviewed separately; these sample cards are not final role specifications.</div><div class="section">${previousDashboard()}</div>`;
  return salespersonDashboard();
};
registerPage=function(page){
  const base=previousRegisterPage(page);
  if(!dashboardDrilldown||dashboardDrilldown.target!==page)return base;
  return `<div class="help sales-filter-banner"><b>From Dashboard:</b> ${esc(dashboardDrilldown.label)} — showing matching fictional sample records. Real access must be enforced on the server. <button type="button" class="btn small" data-dash-clear="1">Clear dashboard filter</button></div>${base}`;
};
filterRows=function(){
  previousFilterRows();
  if(!dashboardDrilldown||dashboardDrilldown.target!==screen)return;
  const f=dashboardDrilldown.filter;
  let visible=0;
  $('#table-body tr').forEach(row=>{
    const t=[...row.querySelectorAll('td')].map(x=>x.textContent.trim());
    let match=true;
    if(f==='my-opportunities')match=t[3]==='Salesperson A'&&!['Closed','Lost'].includes(t[4]);
    if(f==='my-drafts')match=t[4]==='Salesperson A'&&t[5]==='Draft';
    if(f==='my-sent')match=t[4]==='Salesperson A'&&t[5]==='Sent';
    if(f==='my-won-lost')match=t[4]==='Salesperson A'&&['Won','Lost'].includes(t[5]);
    if(f==='awaiting-approval')match=t[3]==='Salesperson A'&&t[5]==='Pending';
    if(f==='draft-orders')match=t[5]==='Draft';
    if(f==='registered-orders')match=t[5]==='Registered';
    if(f==='vendor-followup')match=t[2]==='QT-2026-014'&&t[4]==='Unverified';
    if(!match)row.hidden=true;
    if(!row.hidden)visible++;
  });
  if($('#row-count'))$('#row-count').textContent=visible+' matching sample record(s)';
  if($('#table-empty'))$('#table-empty').classList.toggle('hide',visible!==0);
};
navigate=function(to){
  if(!dashboardDrilldown||dashboardDrilldown.target!==to)dashboardDrilldown=null;
  previousNavigate(to);
  if(REGISTER[to])filterRows();
};
document.addEventListener('click',e=>{
  const card=e.target.closest('[data-dash-filter]');
  if(card){
    e.stopImmediatePropagation();
    dashboardDrilldown={target:card.dataset.go,filter:card.dataset.dashFilter,label:card.dataset.dashLabel};
    navigate(card.dataset.go);
    return;
  }
  const clear=e.target.closest('[data-dash-clear], [data-act="clear-filters"]');
  if(clear&&dashboardDrilldown){
    e.stopImmediatePropagation();
    dashboardDrilldown=null;
    render();
    filterRows();
  }
},true);
document.addEventListener('change',e=>{
  if(e.target.id==='sales-entity'||e.target.id==='sales-branch'){
    memory.forms[e.target.id==='sales-entity'?'PG-003::Entity':'PG-003::Branch']=e.target.value;
    persist();
    toast('Company/branch preview updated. Sample counts and permissions have not changed.');
  }
},true);

render();
})();
</script></body></html>
