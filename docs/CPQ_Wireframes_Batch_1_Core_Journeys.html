function pg004Filter(){
 const body=document.getElementById('pg004-task-body');if(!body)return;
 const q=(document.getElementById('pg004-search')?.value||'').toLowerCase().trim();
 const ty=document.getElementById('pg004-type')?.value||'';
 const pr=document.getElementById('pg004-priority')?.value||'';
 const st=document.getElementById('pg004-state')?.value||'';
 let count=0;Array.from(body.querySelectorAll('[data-pg004-task]')).forEach(tr=>{
 const match=(!q||tr.textContent.toLowerCase().includes(q))&&(!ty||tr.dataset.kind===ty)&&(!pr||tr.dataset.priority===pr)&&(!st||tr.dataset.state===st);tr.hidden=!match;if(match)count++});
 const out=document.getElementById('pg004-result-count');if(out)out.textContent=count+' of '+PG004_TASKS.length+' assigned tasks shown';
 const empty=document.getElementById('pg004-no-results');if(empty)empty.classList.toggle('hide',count!==0);
}
document.addEventListener('input',e=>{if(e.target.id==='pg004-search')pg004Filter()});
document.addEventListener('change',e=>{if(['pg004-type','pg004-priority','pg004-state'].includes(e.target.id))pg004Filter()});
document.addEventListener('click',e=>{if(e.target.closest('[data-pg004-clear]')){['pg004-search','pg004-type','pg004-priority','pg004-state'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});pg004Filter()}});

else if(s.type==='login')body=login();else if(s.type==='profile')body=profile();else if(s.type==='dashboard')body=dashboard();else if(s.type==='work')body=work();else if(s.type==='register')body=registerPage(screen);else if(s.type==='form')body=formScreen(screen);else if(s.type==='detail')body=detailPage(screen);else if(s.type==='quoteBuilder')body=quoteBuilder();else if(s.type==='orderBuilder')body=orderBuilder();else if(s.type==='orderReview')body=orderReview();else if(s.type==='boq')body=boq();else if(s.type==='lineEditor')body=lineEditor();else if(s.type==='pricing')body=pricing();else if(s.type==='restricted')body=restricted();else if(s.type==='verify')body=verify();else if(s.type==='upload')body=upload();else if(s.type==='docpreview')body=docPreview();else if(s.type==='pdf')body=pdfPage();else if(s.type==='pdfSelect')body=pdfSelection();else if(s.type==='timeline')body=timelinePage(screen);else if(s.type==='reportHub')body=reportHub();else if(s.type==='report')body=reportPage(screen);else if(s.type==='settings')body=settingsPage(screen);else body=panel('Workspace',`<p>This workspace is described in Document 2.</p>`);

dashboard=function(){

registerPage=function(page){
  const base=previousRegisterPage(page);
  if(!dashboardDrilldown||dashboardDrilldown.target!==page)return base;
  return `<div class="help sales-filter-banner"><b>From Dashboard:</b> ${esc(dashboardDrilldown.label)} — showing matching fictional sample records. Real access must be enforced on the server. <button type="button" class="btn small" data-dash-clear="1">Clear dashboard filter</button></div>${base}`;
};
filterRows=function(){
  previousFilterRows();
  if(!dashboardDrilldown||dashboardDrilldown.target!==screen)return;
  const f=dashboardDrilldown.filter;
  let visible=0;
  $$('#table-body tr').forEach(row=>{
    const t=[...row.querySelectorAll('td')].map(x=>x.textContent.trim());
    let match=true;
    if(f==='my-opportunities')match=t[3]==='Salesperson A'&&!['Closed','Lost'].includes(t[4]);
    if(f==='my-drafts')match=t[4]==='Salesperson A'&&t[5]==='Draft';
    if(f==='my-sent')match=t[4]==='Salesperson A'&&t[5]==='Sent';
    if(f==='my-won-lost')match=t[4]==='Salesperson A'&&['Won','Lost'].includes(t[5]);
    if(f==='awaiting-approval')match=t[3]==='Salesperson A'&&t[5]==='Pending';
    if(f==='draft-orders')match=t[1]==='Direct Order'&&t[5]==='Draft';
    if(f==='registered-orders')match=t[1]==='Direct Order'&&t[5]==='Registered';
    if(f==='vendor-followup')match=t[2]==='QT-2026-014'&&t[4]==='Unverified';
    if(!match)row.hidden=true;
    if(!row.hidden)visible++;
  });
  if($('#row-count'))$('#row-count').textContent=visible+' matching sample record(s)';
  if($('#table-empty'))$('#table-empty').classList.toggle('hide',visible!==0);
};
navigate=function(to){
  if(!dashboardDrilldown||dashboardDrilldown.target!==to)dashboardDrilldown=null;
  previousNavigate(to);
  if(REGISTER[to])filterRows();
};
document.addEventListener('click',e=>{

    e.stopImmediatePropagation();
    dashboardDrilldown={target:card.dataset.go,filter:card.dataset.dashFilter,label:card.dataset.dashLabel};
    navigate(card.dataset.go);
    return;
  }
  const clear=e.target.closest('[data-dash-clear], [data-act="clear-filters"]');
  if(clear&&dashboardDrilldown){
    e.stopImmediatePropagation();
    dashboardDrilldown=null;
    render();
    filterRows();
  }
},true);

 const selected=pg022SelectedVersion(q);
 const approvals='<div class="pg022-tile"><b>Approval snapshot — '+esc(selected.rev)+'</b><p>'+esc(selected.approval)+'</p><small>No approval workflow evidence is supplied for this sample. Validity must be re-evaluated when a material revision is created.</small></div>';
 const pdf='<div class="pg022-tile"><b>Customer PDF — '+esc(selected.rev)+'</b><p>'+esc(selected.pdf)+'</p><small>No PDF bytes or authorized download are available. Previously issued PDFs must never be replaced by a newer revision.</small><button type="button" class="btn small" disabled title="No authorized PDF file linked in this sample">Download PDF — unavailable</button></div>';
 const actions=pg022CanPdfPreview(q)?'<div class="pg022-inline"><button class="btn" type="button" data-pg022-preview>Open PG-023 PDF workflow (demo)</button></div>':'';
 return '<div class="pg022-tiles">'+approvals+pdf+'</div>'+actions;
}
function pg022Dispatch(q){
 const last=q.sent||'Not sent';
 let html='<div class="pg022-grid">'+pg012Read('Last Sent reference',last)+pg012Read('Actual channel / recipient','Not supplied')+pg012Read('Customer acknowledgement','Not supplied')+pg012Read('Communication evidence','Not verified')+'</div><div class="pg012-hint">The sent date above is fictional metadata, not evidence that email or WhatsApp was dispatched. PG-024 handles verified recording against a specific revision.</div>';
 if(pg022CanDispatch(q))html+='<div class="pg022-inline"><button type="button" class="btn" data-pg022-dispatch>Open PG-024 dispatch/response workflow (demo)</button></div>';
 if(pg022CanOutcome(q))html+='<div class="pg022-editor"><label for="pg022-outcome">Customer-reported outcome (proposed labels)</label><select id="pg022-outcome"><option value="">Select an outcome...</option><option value="Under Negotiation">Under Negotiation</option><option value="Won">Won (requires evidence review)</option><option value="Lost">Lost</option></select><label for="pg022-outcome-reason">Customer response / reason (required for demo)</label><textarea id="pg022-outcome-reason" placeholder="Record what the customer communicated"></textarea><button type="button" class="btn" data-pg022-save-outcome>Record outcome (demo)</button><small>Outcome updates do not alter issued revision snapshots, confirm acceptance or register an order.</small></div>';
 return html;
}
function pg022Parties(q){
 const opp=pg010Mine().find(x=>x.id===q.opportunity);
 if(!opp)return '<div class="pg012-hint"><b>Project party information restricted.</b> Access to a quotation does not automatically grant access to its linked opportunity or customer-party details.</div>';
 const data=PG012_EXTRAS[opp.id]||{};
 const editKey='PG-011.edit.'+opp.id;
 const isSaved=memory.forms['PG-011.saved.'+editKey]===true;
 const get=(label,fallback)=>isSaved?(memory.forms[editKey+'::'+label]??fallback):fallback;
 return '<div class="pg022-grid">'+
  pg012Read('Linked opportunity',opp.id)+pg012Read('Billing customer',q.customer)+
  pg012Read('Main contractor',get('Main contractor',data.contractor||''))+
  pg012Read('End client',get('End client',data.endClient||''))+
  pg012Read('Project / site',get('Project site',data.site||''))+
  pg012Read('Enquiry source',get('Enquiry source',opp.source||''))+
  '</div><div class="pg012-hint">These are fictional project parties from an independently accessible opportunity. The billing customer, main contractor and end client are distinct.</div>';
}
function pg022Documents(q){
 const allowed=pg010Mine().some(x=>x.id===q.opportunity)&&(PG012_DOC_GRANTS[role]||[]).includes(q.opportunity);
 return '<div class="pg022-grid">'+
 pg012Read('Quotation-specific attachments','None provided in the sample')+
 pg012Read('Original opportunity documents',allowed?'See separately authorized opportunity document workspace':'Not available under this role\'s opportunity/document grant')+
 '</div><div class="pg012-hint">Quotation attachments, customer enquiry files, supplier evidence and revision-specific PDFs must be permission checked independently. This page does not copy or expose files merely because a quotation is visible. Document workflows are reviewed on PG-090/091 and PDF issuance on PG-023.</div>';
}
function pg022Orders(q){
 const won=q.status==='Won';
 return '<div class="pg022-grid">'+pg012Read('Customer outcome',won?'Won (illustrative; unverified)':'Not confirmed as accepted')+pg012Read('Registered order reference','None in this browser prototype')+pg012Read('Acceptance / PO / WO / LOI evidence','Not verified')+pg012Read('Accepted commercial values','Not verified; restricted')+'</div>'+
 '<div class="pg012-hint">The PG-025 accepted-quote order registration process requires the actual accepted revision, evidence, commercial differences and an authorized registration decision. No action here creates an order.</div>'+
 (won?'<button type="button" class="btn" disabled title="Verified acceptance evidence and order registration authority are missing">Register Accepted Order — blocked pending evidence</button>':'<span class="smallnote">Order registration is not available without a verified acceptance.</span>');
}
function pg022Activity(q){
 const history=pg022Events(q);
 const base=pg022Versions(q).filter(v=>v.immutable).map(v=>({type:'Historical revision',note:'Revision '+v.rev+' is preserved as a read-only '+v.status+' sample. Sent reference: '+v.sent+'.',time:v.sent,actor:v.preparedBy}));
 if(pg022Versions(q).some(v=>!v.immutable))base.unshift({type:'Working revision',note:'Draft '+q.rev+' is the current working revision. No issuance or PDF is implied.',time:q.updated||'Local demo',actor:q.owner});
 const saved=memory.forms['PG-021.savedAt.quote-'+q.id];
 if(saved)base.unshift({type:'Draft saved',note:'Builder values saved locally for this current draft (not issued).',time:saved,actor:q.owner});
 const items=[...history,...base];
 return '<div class="pg022-timeline">'+items.map(x=>'<div class="pg022-event"><b>'+esc(x.type)+'</b><p>'+esc(x.note)+'</p><small>'+esc(x.actor)+' · '+esc(x.time)+'</small></div>').join('')+'</div><div class="pg012-hint">A production audit log will retain user, timestamp, old/new revision details and evidence references. These entries are fictional or local browser events only.</div>';
}
function pg022Actions(q){
 let actions=button('Back to Quotation Register','PG-020');
 if(pg020CanEdit(q))actions+='<button type="button" class="btn" data-pg020-edit="'+esc(q.id)+'">Open Current Draft (demo)</button>';
 if(pg022CanRevision(q))actions+='<button type="button" class="btn" data-pg022-create-revision>Create New Revision (demo)</button>';
 if(pg022CanDispatch(q))actions+='<button type="button" class="btn" data-pg022-dispatch>Record Dispatch / Response (PG-024)</button>';
 if(pg022CanPdfPreview(q))actions+='<button type="button" class="btn" data-pg022-preview>PDF workflow (PG-023)</button>';
 return '<div class="pg022-actions">'+actions+'</div>';
}
function pg022Detail(){
 const q=pg020Selected();
 if(!q)return '<div class="warning"><b>Quotation access unavailable.</b> The selected quotation is not in the current role\'s illustrative quotation grant. No record, revision or financial details are exposed.</div>'+button('Back to Quotation Register','PG-020');
 const selected=pg022SelectedVersion(q);
 const header='<div class="pg022-identity"><div><b>'+esc(q.id)+'</b><span>'+esc(q.customer)+'</span></div><div>'+badge(q.status)+' '+badge(q.rev)+'</div></div>';
 const overview=header+'<div class="pg022-grid">'+
 pg012Read('Linked opportunity',q.opportunity||'Not linked in local demo')+pg012Read('Current revision',q.rev)+pg012Read('Quotation status / outcome',q.status)+pg012Read('Work type',q.workType)+pg012Read('Legal entity / branch',q.entity+' / '+q.branch)+pg012Read('Responsible / prepared by',q.owner)+pg012Read('Last updated',q.updated)+pg012Read('Last Sent',q.sent||'Not sent')+'</div>'+
 '<div class="pg012-hint">Customer and parties are sourced from this quotation\'s sample record. Customer-visible selling totals, acceptance values, supplier costs and margins are withheld without an approved financial viewing grant.</div>';
 const main=panel('Quotation overview',overview)+
 '<div class="section">'+panel('Customer & project parties',pg022Parties(q))+'</div>'+
 '<div class="section">'+panel('Revision history — current and preserved versions',pg022VersionTable(q))+'</div>'+
 '<div class="section">'+panel('Approval & PDF snapshots',pg022ApprovalPdf(q))+'</div>'+
 '<div class="section">'+panel('Supporting documents & evidence',pg022Documents(q))+'</div>'+
 '<div class="section">'+panel('Dispatch & customer response',pg022Dispatch(q))+'</div>'+
 '<div class="section">'+panel('Linked order & acceptance verification',pg022Orders(q))+'</div>'+
 '<div class="section">'+panel('Activity & change history',pg022Activity(q))+'</div>';
 const sidebar=panel('Permitted actions',pg022Actions(q))+
 '<div class="section">'+panel('Revision integrity','<div class="pg022-check"><b>Current revision</b><span>'+esc(q.rev)+' · '+esc(q.status)+'</span></div><div class="pg022-check"><b>Selected revision</b><span>'+esc(selected.rev)+(selected.immutable?' · read-only':' · draft')+'</span></div><div class="pg022-check"><b>Historical PDF</b><span>Not attached in this sample</span></div><div class="pg012-hint">Draft editing, new revisions, customer dispatch, PDF access and order registration require independent permissions and checks. This is not a production authorization matrix.</div>')+'</div>';
 return '<div class="pg022-layout"><div>'+main+'</div><aside>'+sidebar+'</aside></div>';
}
pg020DetailPending=pg022Detail;
const pg022OldHeader=headerButtons;
headerButtons=function(s){
 if(s.id==='PG-022'){
  const q=pg020Selected();
  return button('Quotation Register','PG-020')+(q&&pg020CanEdit(q)?'<button type="button" class="btn primary" data-pg020-edit="'+esc(q.id)+'">Edit Current Draft</button>':q&&pg022CanRevision(q)?'<button type="button" class="btn primary" data-pg022-create-revision>Create New Revision (demo)</button>':'');
 }
 return pg022OldHeader(s);
};
const pg022OldQuoteList=pg012QuoteList;
pg012QuoteList=function(r){
 return pg022OldQuoteList(r).map(ref=>{
  const q=pg020Visible().find(x=>x.id===ref.id);
  return q?{...ref,rev:q.rev,status:q.status}:ref;
 });
};
const pg022OldAppBody=appBody;
appBody=function(){
 const body=pg022OldAppBody();
 if(pg022Related&&pg022Related.target===screen&&['PG-023','PG-024'].includes(screen)){
  const q=pg020Visible().find(x=>x.id===pg022Related.id);
  if(!q)return '<div class="warning">The related quotation is no longer accessible with this demo role. Return to your quotation register.</div>'+button('Quotation Register','PG-020');
  return '<div class="help pg022-context"><b>Related quotation workflow:</b> '+esc(q.id)+' · '+esc(q.rev)+' · '+esc(q.customer)+' · '+esc(SCREENS[screen].title)+'. This is a generic wireframe, not a record-specific issuance or dispatch. <button class="btn small" data-go="PG-022">Back to Quotation Details</button></div>'+body;
 }
 return body;
};
document.addEventListener('click',function(e){
 if(screen!=='PG-022'&&!(e.target.closest('[data-pg022-confirm-revision]')))return;
 const rev=e.target.closest('[data-pg022-revision]');
 if(rev&&screen==='PG-022'){
  const q=pg020Selected(),target=rev.dataset.pg022Revision;
  if(!q||!pg022Versions(q).some(x=>x.rev===target))return;
  pg022SelectedRevision=target;render();return;
 }
 const q=pg020Selected();if(!q)return;
 if(e.target.closest('[data-pg022-create-revision]')){
  if(!pg022CanRevision(q)){toast('This example does not grant a new revision for the selected quotation.');return}
  openModal('Create a new draft revision (demo)','<p>The issued '+esc(q.rev)+' snapshot stays preserved and cannot be overwritten. This creates a <b>new working draft '+esc('R'+(Number(q.rev.slice(1))+1))+'</b> and resets approval/PDF review requirements. It does not generate a PDF, notify a customer, or register an order.</p>','<button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-pg022-confirm-revision>Confirm New Draft Revision</button>');return;
 }
 if(e.target.closest('[data-pg022-confirm-revision]')){
  if(!pg022CanRevision(q)){closeModal();return}
  const nextRev='R'+(Number(q.rev.slice(1))+1),now=new Date(),updated=now.toLocaleDateString('en-GB'),updatedISO=now.toISOString().slice(0,10);
  memory.forms['PG-022.current.'+q.id]={rev:nextRev,status:'Draft',updated:'Local browser revision · '+updated,updatedISO};
  pg022AddEvent(q,'New draft revision','Created '+nextRev+' as a local working draft. Preserved '+q.rev+' issued revision; approvals and PDF must be re-checked.');
  pg022SelectedRevision=nextRev;pg020EditingQuoteId=q.id;pg020SelectedQuoteId=q.id;pg012QuoteContext=null;
  persist();closeModal();navigate('PG-021');toast('New draft revision '+nextRev+' created locally. Earlier issued revision preserved.');return;
 }
 if(e.target.closest('[data-pg022-preview]')){
  if(!pg022CanPdfPreview(q)){toast('No illustrative PDF workflow permission.');return}
  pg022Related={target:'PG-023',id:q.id};navigate('PG-023');return;
 }
 if(e.target.closest('[data-pg022-dispatch]')){
  if(!pg022CanDispatch(q)){toast('No illustrative dispatch workflow permission.');return}
  pg022Related={target:'PG-024',id:q.id};navigate('PG-024');return;
 }
 if(e.target.closest('[data-pg022-save-outcome]')){
  if(!pg022CanOutcome(q))return;
  const status=document.getElementById('pg022-outcome')?.value||'';
  const note=document.getElementById('pg022-outcome-reason')?.value.trim()||'';
  if(!['Under Negotiation','Won','Lost'].includes(status)){toast('Select a customer-reported outcome.');return}
  if(note.length<5){toast('Add a short customer response/reason (at least 5 characters).');document.getElementById('pg022-outcome-reason')?.focus();return}
  const original=memory.forms['PG-022.current.'+q.id]||{};
  memory.forms['PG-022.current.'+q.id]={...original,rev:q.rev,status,updated:new Date().toLocaleDateString('en-GB')+' · local demo',updatedISO:new Date().toISOString().slice(0,10)};
  pg022AddEvent(q,'Customer response','Reported '+status+' — '+note.slice(0,600)+' (unverified; no accepted order registered)');
  render();toast('Customer response recorded in browser demo. Issued revision unchanged.');return;
 }
});
document.addEventListener('change',function(e){
 if(screen==='PG-022'&&e.target.id==='pg022-filter'){pg022Filter=e.target.value;render()}
 if(screen==='PG-022'&&e.target.id==='pg022-sort'){pg022Sort=e.target.value;render()}
 if(e.target.id==='role-selector'){pg022SelectedQuoteKey=null;pg022SelectedRevision=null;pg022Related=null}
},true);

render();
})();
</script></body></html>
